spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://100.109.13.14:5432/jfoil}
    username: ${SPRING_DATASOURCE_USERNAME:jfoiluser}
    password: ${SPRING_DATASOURCE_PASSWORD:jfoilpassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  threads:
    virtual:
      enabled: true
  cache:
    cache-names: fileTree, stats
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

jfoil:
  storage:
    path: '${JFOIL_STORAGE_PATH:C:\ScanFolder}'

server:
  port: 8080
