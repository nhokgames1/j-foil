<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Foil - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(22, 30, 49, 0.65);
            --primary-color: #3b82f6;
            --secondary-color: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            --accent-glow: 0 0 25px rgba(168, 85, 247, 0.25);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Background Glows */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(130px);
            z-index: -1;
            opacity: 0.18;
            pointer-events: none;
        }
        body::before {
            top: -50px;
            left: -50px;
            background: var(--primary-color);
        }
        body::after {
            bottom: -50px;
            right: -50px;
            background: var(--secondary-color);
        }

        .login-card {
            background: var(--surface-color);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 45px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            transition: all 0.3s ease;
            position: relative;
        }
        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(130deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 60%);
            border-radius: 24px;
            pointer-events: none;
        }
        .login-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.6), 0 0 25px rgba(59, 130, 246, 0.05);
        }

        .brand-icon {
            font-size: 40px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4));
            margin-bottom: 10px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: white !important;
            border-radius: 12px !important;
            padding: 14px 18px !important;
            font-size: 15px;
            transition: all 0.3s ease !important;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 18px rgba(59, 130, 246, 0.25) !important;
        }
        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .btn-custom {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25);
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(168, 85, 247, 0.4), var(--accent-glow);
            opacity: 0.95;
            color: white;
        }
        .btn-custom:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid transparent;
            padding: 12px 16px;
            margin-bottom: 24px;
        }
        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .alert-info {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon"><i class="fa-solid fa-gamepad"></i></div>
            <h2 class="fw-bold mb-1" style="letter-spacing: -0.5px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">J-Foil Admin</h2>
            <p class="text-muted small m-0" style="letter-spacing: 1px; text-transform: uppercase;">Switch Shop Management</p>
        </div>
        
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-info" role="alert">
            <i class="fa-solid fa-circle-info me-2"></i>You have been logged out successfully.
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <input type="text" name="username" class="form-control form-control-lg" placeholder="Username" required autofocus autocomplete="off">
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control form-control-lg" placeholder="Password" required>
            </div>
            <button class="btn btn-custom btn-lg w-100 text-white" type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
