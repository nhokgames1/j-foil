<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Foil Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
            width: 100%;
            max-width: 400px;
        }
        .glass-card input {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
        }
        .glass-card input:focus {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            box-shadow: none;
            outline: none;
        }
        .glass-card input::placeholder {
            color: #ddd;
        }
        .btn-custom {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2 class="text-center mb-4">J-Foil Admin</h2>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-info" role="alert">
            You have been logged out.
        </div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <input type="text" name="username" class="form-control form-control-lg" placeholder="Username" required autofocus>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control form-control-lg" placeholder="Password" required>
            </div>
            <button class="btn btn-custom btn-lg w-100 text-white" type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
