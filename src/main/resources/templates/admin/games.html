<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Games List - J-Foil')}"></head>
<body>
    <div th:replace="~{admin/fragments/sidebar :: sidebar('games')}"></div>
    
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="m-0">Games Directory</h2>
            <form th:action="@{/admin/files/refresh}" method="post">
                <button type="submit" class="btn btn-gradient">
                    <i class="fa-solid fa-arrows-rotate me-2"></i>Scan Folder
                </button>
            </form>
        </div>

        <div class="glass-card mb-4">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-right: none; color: var(--text-muted);">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="searchGames" class="form-control" placeholder="Search games by filename..." onkeyup="filterGames(this.value)" style="border-left: none;">
                    </div>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <span class="text-muted" id="gamesCountText">Showing all <span th:text="${#lists.size(files)}">0</span> games</span>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <table class="table table-striped table-borderless">
                <thead>
                    <tr>
                        <th>Game File</th>
                        <th>Path</th>
                        <th>File Size</th>
                    </tr>
                </thead>
                <tbody id="gamesTableBody">
                    <tr th:each="file : ${files}">
                        <td class="game-name fw-bold text-info" th:text="${#strings.substringAfter(file.url, '/') != '' ? #strings.substringAfter(file.url, 'files/') : file.url}">game.nsp</td>
                        <td class="text-muted" th:text="${file.url}">files/game.nsp</td>
                        <td class="file-size" th:data-size="${file.size}">0 B</td>
                    </tr>
                    <tr id="noGamesRow" style="display: none;">
                        <td colspan="3" class="text-center text-muted py-4">No matching games found.</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(files)}">
                        <td colspan="3" class="text-center text-muted py-4">No games found in the storage path. Click "Scan Folder" to refresh.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Format sizes on DOM load
        document.addEventListener("DOMContentLoaded", function() {
            const sizeCells = document.querySelectorAll(".file-size");
            sizeCells.forEach(cell => {
                const bytes = parseInt(cell.getAttribute("data-size"));
                cell.textContent = formatBytes(bytes);
            });
        });

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            if (bytes < 1024) return bytes + ' B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function filterGames(query) {
            const filter = query.toLowerCase().trim();
            const rows = document.querySelectorAll("#gamesTableBody tr:not(#noGamesRow)");
            const noGamesRow = document.getElementById("noGamesRow");
            let visibleCount = 0;

            rows.forEach(row => {
                const gameName = row.querySelector(".game-name").textContent.toLowerCase();
                const gamePath = row.querySelector("td:nth-child(2)").textContent.toLowerCase();
                if (gameName.includes(filter) || gamePath.includes(filter)) {
                    row.style.display = "";
                    visibleCount++;
                } else {
                    row.style.display = "none";
                }
            });

            // Handle empty result state
            if (visibleCount === 0 && rows.length > 0) {
                noGamesRow.style.display = "";
            } else {
                noGamesRow.style.display = "none";
            }

            // Update count text
            const countText = document.getElementById("gamesCountText");
            if (filter === "") {
                countText.innerHTML = "Showing all " + rows.length + " games";
            } else {
                countText.innerHTML = "Found " + visibleCount + " matching games";
            }
        }
    </script>
</body>
</html>
