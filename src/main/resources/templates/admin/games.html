<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Games List - J-Foil')}"></head>
<body>
    <div th:replace="~{admin/fragments/sidebar :: sidebar('games')}"></div>
    
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="m-0">Games Directory</h2>
            <form th:action="@{/admin/files/refresh}" method="post">
                <button type="submit" class="btn btn-gradient">
                    <i class="fa-solid fa-arrows-rotate me-2"></i>Scan Folder
                </button>
            </form>
        </div>

        <div class="glass-card mb-4">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <form th:action="@{/admin/games}" method="get" class="m-0">
                        <div class="input-group">
                            <span class="input-group-text" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-right: none; color: var(--text-muted);">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search games by filename..." style="border-left: none;">
                            <button class="btn btn-gradient" type="submit" style="border-radius: 0 8px 8px 0;">Search</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <span class="text-muted" id="gamesCountText">Showing <span th:text="${#lists.size(files)}">0</span> of <span th:text="${totalFiles}">0</span> games</span>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <table class="table table-striped table-borderless mb-0">
                <thead>
                    <tr>
                        <th>Game File</th>
                        <th>Path</th>
                        <th>File Size</th>
                    </tr>
                </thead>
                <tbody id="gamesTableBody">
                    <tr th:each="file : ${files}">
                        <td class="game-name fw-bold text-info" th:text="${#strings.substringAfter(file.url, '/') != '' ? #strings.substringAfter(file.url, 'files/') : file.url}">game.nsp</td>
                        <td class="text-muted" th:text="${file.url}">files/game.nsp</td>
                        <td class="file-size" th:data-size="${file.size}">0 B</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(files)}">
                        <td colspan="3" class="text-center text-muted py-4">No games found.</td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4 mb-2">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/games(page=${currentPage - 1}, search=${search})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        
                        <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                            <li th:if="${i >= currentPage - 2 and i <= currentPage + 2}" class="page-item" th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/admin/games(page=${i}, search=${search})}" th:text="${i}">1</a>
                            </li>
                        </th:block>
                        
                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/games(page=${currentPage + 1}, search=${search})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Format sizes on DOM load
        document.addEventListener("DOMContentLoaded", function() {
            const sizeCells = document.querySelectorAll(".file-size");
            sizeCells.forEach(cell => {
                const bytes = parseInt(cell.getAttribute("data-size"));
                cell.textContent = formatBytes(bytes);
            });
        });

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            if (bytes < 1024) return bytes + ' B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

    </script>
</body>
</html>
