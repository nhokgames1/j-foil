<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Users - J-Foil')}"></head>
<body>
    <div th:replace="~{admin/fragments/sidebar :: sidebar('users')}"></div>
    
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>User Management</h2>
            <button class="btn btn-gradient" data-bs-toggle="modal" data-bs-target="#addUserModal">
                <i class="fa-solid fa-plus me-2"></i>Add User
            </button>
        </div>

        <div class="glass-card">
            <table class="table table-striped table-borderless">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Sub Expiry</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.username}">username</td>
                        <td><span class="badge bg-secondary" th:text="${user.role}">USER</span></td>
                        <td>
                            <span th:each="sub : ${subscriptions}" th:if="${sub.user.id == user.id}" 
                                  th:text="${#temporals.format(sub.expiryDate, 'yyyy-MM-dd')}">2023-12-01</span>
                        </td>
                        <td>
                            <span th:each="sub : ${subscriptions}" th:if="${sub.user.id == user.id}">
                                <span class="badge bg-success" th:if="${sub.active and sub.expiryDate.isAfter(T(java.time.LocalDateTime).now())}">Active</span>
                                <span class="badge bg-danger" th:unless="${sub.active and sub.expiryDate.isAfter(T(java.time.LocalDateTime).now())}">Inactive/Expired</span>
                            </span>
                        </td>
                        <td>
                            <div class="dropdown">
                                <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    Actions
                                </button>
                                <ul class="dropdown-menu dropdown-menu-dark">
                                    <li>
                                        <button type="button" class="dropdown-item" data-bs-toggle="modal" th:data-bs-target="'#resetPasswordModal' + ${user.id}">
                                            <i class="fa-solid fa-key me-2"></i>Change Password
                                        </button>
                                    </li>
                                    <li>
                                        <button type="button" class="dropdown-item" data-bs-toggle="modal" th:data-bs-target="'#extendSubModal' + ${user.id}">
                                            <i class="fa-solid fa-clock me-2"></i>Extend Sub
                                        </button>
                                    </li>
                                    <li>
                                        <form th:action="@{/admin/users/toggle-sub}" method="post" style="display:inline;">
                                            <input type="hidden" name="id" th:value="${user.id}">
                                            <button type="submit" class="dropdown-item"><i class="fa-solid fa-power-off me-2"></i>Toggle Sub</button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/admin/users/delete}" method="post" style="display:inline;">
                                            <input type="hidden" name="id" th:value="${user.id}">
                                            <button type="submit" class="dropdown-item text-danger"><i class="fa-solid fa-trash me-2"></i>Delete</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>


                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Reset Password Modals per user -->
    <th:block th:each="user : ${users}">
        <div class="modal fade" th:id="'resetPasswordModal' + ${user.id}" tabindex="-1" data-bs-theme="dark">
            <div class="modal-dialog">
                <div class="modal-content" style="background-color: var(--surface-color); border: 1px solid rgba(255,255,255,0.1);">
                    <div class="modal-header border-0">
                        <h5 class="modal-title text-white">Change Password for <span th:text="${user.username}"></span></h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/users/reset-password}" method="post">
                        <input type="hidden" name="id" th:value="${user.id}">
                        <div class="modal-body text-white">
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" name="password" class="form-control" required style="background: rgba(255,255,255,0.05); color: white; border: none;">
                            </div>
                        </div>
                        <div class="modal-footer border-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-warning">Reset Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>

    <!-- Extend Sub Modals per user -->
    <th:block th:each="user : ${users}">
        <div class="modal fade" th:id="'extendSubModal' + ${user.id}" tabindex="-1" data-bs-theme="dark">
            <div class="modal-dialog">
                <div class="modal-content" style="background-color: var(--surface-color); border: 1px solid rgba(255,255,255,0.1);">
                    <div class="modal-header border-0">
                        <h5 class="modal-title text-white">Extend Subscription for <span th:text="${user.username}"></span></h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/admin/users/extend-sub}" method="post">
                        <input type="hidden" name="id" th:value="${user.id}">
                        <div class="modal-body text-white">
                            <div class="mb-3">
                                <label class="form-label">Extend Duration</label>
                                <select th:id="'extendDurationSelect' + ${user.id}" name="duration" class="form-select" th:onchange="'toggleExtendManualExpiryDate(' + ${user.id} + ', this.value)'">
                                    <option value="1">+1 Month</option>
                                    <option value="6">+6 Months</option>
                                    <option value="12">+12 Months</option>
                                    <option value="manual">Set Custom Expiry Date</option>
                                </select>
                            </div>
                            <div class="mb-3" th:id="'extendManualExpiryContainer' + ${user.id}" style="display: none;">
                                <label class="form-label">Expiry Date</label>
                                <input type="date" th:id="'extendManualExpiryInput' + ${user.id}" name="manualExpiry" class="form-control">
                            </div>
                        </div>
                        <div class="modal-footer border-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-gradient">Confirm Extension</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1" data-bs-theme="dark">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--surface-color); border: 1px solid rgba(255,255,255,0.1);">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white">Add New User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/users/add}" method="post">
                    <div class="modal-body text-white">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required style="background: rgba(255,255,255,0.05); color: white; border: none;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required style="background: rgba(255,255,255,0.05); color: white; border: none;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select">
                                <option value="USER">USER</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subscription Duration</label>
                            <select id="subDurationSelect" name="duration" class="form-select" onchange="toggleManualExpiryDate(this.value)">
                                <option value="1">1 Month</option>
                                <option value="6">6 Months</option>
                                <option value="12">12 Months</option>
                                <option value="manual">Manual Expiry Date</option>
                            </select>
                        </div>
                        <div class="mb-3" id="manualExpiryDateContainer" style="display: none;">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" id="manualExpiryInput" name="manualExpiry" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-gradient">Save User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleManualExpiryDate(val) {
            var container = document.getElementById('manualExpiryDateContainer');
            var input = document.getElementById('manualExpiryInput');
            if (val === 'manual') {
                container.style.display = 'block';
                input.required = true;
            } else {
                container.style.display = 'none';
                input.required = false;
                input.value = '';
            }
        }
        function toggleExtendManualExpiryDate(userId, val) {
            var container = document.getElementById('extendManualExpiryContainer' + userId);
            var input = document.getElementById('extendManualExpiryInput' + userId);
            if (val === 'manual') {
                container.style.display = 'block';
                input.required = true;
            } else {
                container.style.display = 'none';
                input.required = false;
                input.value = '';
            }
        }
    </script>
</body>
</html>
