<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">J-Foil Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(22, 30, 49, 0.65);
            --card-bg: rgba(22, 30, 49, 0.45);
            --primary-color: #3b82f6;
            --secondary-color: #a855f7;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.07);
            --primary-gradient: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            --accent-glow: 0 0 25px rgba(168, 85, 247, 0.25);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Background Glows */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }
        body::before {
            top: -100px;
            left: -100px;
            background: var(--primary-color);
        }
        body::after {
            bottom: -100px;
            right: -100px;
            background: var(--secondary-color);
        }

        .sidebar {
            width: 270px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(25px);
            padding: 30px 20px;
            border-right: 1px solid var(--border-color);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 45px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .brand:hover {
            transform: scale(1.02);
        }
        .brand i {
            font-size: 28px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4));
        }

        .nav-link {
            color: var(--text-muted);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .nav-link:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.05);
            transform: translateX(4px);
        }
        .nav-link.active {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary-color);
            border-color: rgba(59, 130, 246, 0.2);
            box-shadow: inset 0 0 12px rgba(59, 130, 246, 0.05);
        }
        .nav-link i {
            margin-right: 12px;
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        .nav-link:hover i {
            transform: scale(1.1);
        }

        .main-content {
            flex: 1;
            padding: 45px 50px;
            overflow-y: auto;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 28px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(130deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 60%);
            pointer-events: none;
        }
        .glass-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4), 0 0 20px rgba(59, 130, 246, 0.05);
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: 700;
            margin-top: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        
        .stat-card-download .stat-value {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card-month .stat-value {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card-bandwidth .stat-value {
            background: linear-gradient(135deg, #34d399, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .table {
            color: var(--text-main);
            margin-bottom: 0;
        }
        .table thead th {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 16px 20px;
        }
        .table td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
            color: var(--text-main);
            padding: 18px 20px;
            background-color: transparent !important;
        }
        .table-striped>tbody>tr:nth-of-type(odd)>* {
            background-color: rgba(255, 255, 255, 0.015) !important;
        }
        .table tbody tr {
            transition: background-color 0.2s ease;
        }
        .table tbody tr:hover td {
            background-color: rgba(255, 255, 255, 0.03) !important;
        }

        .btn-gradient {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35), var(--accent-glow);
            opacity: 0.95;
            color: white;
        }
        .btn-gradient:active {
            transform: translateY(0);
        }

        .badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.3px;
        }
        .badge.bg-primary {
            background: rgba(59, 130, 246, 0.15) !important;
            color: #60a5fa !important;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .badge.bg-secondary {
            background: rgba(148, 163, 184, 0.15) !important;
            color: #cbd5e1 !important;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .badge.bg-success {
            background: rgba(16, 185, 129, 0.15) !important;
            color: #34d399 !important;
            border: 1px solid rgba(16, 185, 129, 0.3);
            position: relative;
            padding-left: 20px;
        }
        .badge.bg-success::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
            animation: pulse-dot 1.8s infinite;
        }
        .badge.bg-danger {
            background: rgba(239, 68, 68, 0.15) !important;
            color: #f87171 !important;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @keyframes pulse-dot {
            0% { transform: translateY(-50%) scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: translateY(-50%) scale(1); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
            100% { transform: translateY(-50%) scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .logout-form {
            position: absolute;
            bottom: 30px;
            width: calc(270px - 40px);
        }
        .logout-form .btn {
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 14px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .logout-form .btn:hover {
            background: rgba(239, 68, 68, 0.08) !important;
            border-color: rgba(239, 68, 68, 0.2);
            color: var(--danger-color) !important;
            transform: translateX(4px);
        }

        /* Modal Customizations */
        .modal-content {
            background: rgba(22, 30, 49, 0.95) !important;
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color) !important;
            border-radius: 20px !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: white !important;
            border-radius: 10px !important;
            padding: 12px 16px !important;
            transition: all 0.3s ease !important;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2) !important;
        }
    </style>
</head>
